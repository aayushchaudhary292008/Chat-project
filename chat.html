<!DOCTYPE html>
<html>
<head>
    <title>Simple ChatGPT Clone</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    
    <div class="main-layout">
        
        <!-- Sidebar Section -->
        <div class="sidebar">
            <h2>ChatGPT</h2>
            <button>New chat</button>
            
            <!-- Menu Links -->
            <ul>
                <li><a href="#">Images</a></li>
                <li><a href="#">Scheduled</a></li>
                <li><a href="#">Library</a></li>
                <li><a href="#">Plugins</a></li>
            </ul>

            <!-- User Info at bottom -->
            <div class="user-info">
                <p><strong>Ayush</strong></p>
                <p>Free Plan</p>
            </div>
        </div>

        <!-- Chat Area Section -->
        <div class="chat-area">
            
            <!-- Top Navigation -->
            <div class="top-nav">
                <button class="active">Chat</button>
                <button>Work</button>
            </div>

            <!-- Central Content Box -->
            <div class="center-box">
                <h1>How can I help, Ayush?</h1>
                
                <!-- Search / Input Bar -->
                <div class="input-container">
                    <span>+</span>
                    <input type="text" placeholder="Ask ChatGPT">
                    <span>Send</span>
                </div>

                <!-- Option Buttons -->
                <div class="option-buttons">
                    <button>Create an image</button>
                    <button>Write or edit</button>
                    <button>Search the web</button>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
